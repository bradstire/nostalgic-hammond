<title>Nostalgic Hammond — Approved Hero Mockup</title>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #2C2825; font-family: 'Playfair Display', serif; }
  
  /* Nav */
  .nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 48px;
    background: #3B3632;
    border-bottom: 2px solid #B85C3E;
    position: relative;
    z-index: 10;
  }
  .nav-logo {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    color: #E8E0D4;
    letter-spacing: 1px;
  }
  .nav-logo .nostalgic-word {
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-size: 16px;
    font-style: normal;
  }
  .nav-logo .hammond-word {
    font-style: italic;
    font-weight: 400;
  }
  /* Variant B: color contrast */
  .nav-logo.variant-b .hammond-word {
    color: #B85C3E;
  }
  .nav-links {
    display: flex;
    gap: 40px;
  }
  .nav-links a {
    color: #E8E0D4;
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 3px;
    font-family: sans-serif;
  }
